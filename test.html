<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="{{url_for('static', filename='style_quiz.css')}}">
    <title>Викторина</title>
</head>
<body>
    <div class="div_custom">
    <h1 class="h_custom">{{question}}</h1>
    <form method="post" action="test">
        <input type="hidden" name="q_id" value="{{quest_id}}">

        <div class="form_radio_btn">
        {%for answer in answers%}
            <input id="radio{{loop.index}}" type="radio" name="ans_text" value="{{answer}}"> <label for="radio{{loop.index}}">{{answer}}
            </label>
        {%endfor%}
        </div>

        <input type="submit" value="ответить" class="button_custom">
    </form>
    </div>
</body>
</html>
